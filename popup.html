<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 360px; font-family: 'Segoe UI', Tahoma, sans-serif; padding: 12px; margin: 0; background: #fafafa; }
    h3 { margin-top: 0; color: #0078d4; font-size: 15px; margin-bottom: 8px; }
    .api-container { margin-bottom: 8px; display: flex; gap: 4px; }
    .api-container input { flex: 1; padding: 6px; font-size: 11px; border: 1px solid #ccc; border-radius: 4px; }
    .meta-card { background: #eef3f8; padding: 8px; border-left: 3px solid #0078d4; margin-bottom: 8px; font-size: 11px; display: none; }
    .meta-card p { margin: 2px 0; color: #333; }
    
    button { width: 100%; padding: 8px; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 6px; font-size: 12px; }
    #btnExtraer { background: #0078d4; }
    #btnExtraer:hover { background: #005a9e; }
    #btnResumir { background: #6b21a8; display: none; } /* Color morado para IA */
    #btnResumir:hover { background: #581c87; }
    #btnPdf { background: #d13438; display: none; }
    #btnPdf:hover { background: #a4262c; }

    textarea { width: 100%; height: 120px; box-sizing: border-box; font-family: sans-serif; font-size: 11px; margin-bottom: 6px; }
    .label-box { font-size: 11px; font-weight: bold; color: #555; margin-top: 4px; }
  </style>
</head>
<body>
  <h3>Transcripción & Resumen con Gemini</h3>

  <!-- Campo de configuración para la API Key -->
  <div class="api-container">
    <input type="password" id="txtApiKey" placeholder="Pega tu Gemini API Key aquí..." />
    <button id="btnGuardarKey" style="width: 70px; background: #444; margin: 0;">Guardar</button>
  </div>
  
  <button id="btnExtraer">1. Obtener Transcripción</button>

  <div id="metaBox" class="meta-card">
    <p><strong>Clase:</strong> <span id="lblTitulo">-</span></p>
    <p><strong>Fecha:</strong> <span id="lblFecha">-</span> | <strong>Hora:</strong> <span id="lblHora">-</span></p>
  </div>

  <button id="btnResumir">2. Generar Resumen con Gemini IA</button>

  <div id="seccionResumen" style="display:none;">
    <div class="label-box">Resumen de la Clase:</div>
    <textarea id="txtResumen" placeholder="Generando resumen con IA..."></textarea>
  </div>

  <div class="label-box">Transcripción Completa:</div>
  <textarea id="resultado" placeholder="Aquí aparecerá el texto extraído..."></textarea>
  
  <button id="btnPdf">3. Descargar PDF con Metadatos y Resumen</button>

  <script src="popup.js"></script>
</body>
</html>
