<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>OnedriveTranscript</title>
  <style>
    body {
      width: 380px;
      margin: 0;
      padding: 12px;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #fafafa;
      font-size: 12px;
    }

    h3 {
      margin: 0 0 10px 0;
      font-size: 15px;
      color: #0078d4;
    }

    .api-container {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .api-container input {
      flex: 1;
      padding: 6px;
      font-size: 11px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    #btnGuardarKey {
      width: 74px;
      background: #444;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
    }

    button {
      width: 100%;
      padding: 8px;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
      margin-bottom: 6px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #btnExtraer { background: #0078d4; }
    #btnExtraer:hover:not(:disabled) { background: #005a9e; }
    #btnResumir { background: #6b21a8; }
    #btnResumir:hover:not(:disabled) { background: #581c87; }
    #btnPdf { background: #d13438; }
    #btnPdf:hover { background: #a4262c; }

    /* Área de estados / carga / errores (sin alert) */
    #estadoPopup {
      display: none;
      padding: 7px 9px;
      margin: 8px 0;
      border-radius: 5px;
      font-size: 11px;
      line-height: 1.4;
    }

    .meta-card {
      display: none;
      background: #eef3f8;
      border-left: 3px solid #0078d4;
      padding: 8px;
      margin-bottom: 8px;
      font-size: 11px;
    }

    .meta-card p { margin: 2px 0; color: #333; }

    .cabecera-bloque {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
    }

    .label-box {
      font-size: 11px;
      font-weight: bold;
      color: #555;
    }

    .btn-mini {
      width: auto;
      margin: 0 0 3px 0;
      padding: 3px 10px;
      font-size: 10px;
      background: #666;
    }

    .btn-mini:hover { background: #333; }

    textarea {
      width: 100%;
      box-sizing: border-box;
      height: 120px;
      margin-bottom: 6px;
      padding: 6px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 11px;
      border: 1px solid #ccc;
      border-radius: 4px;
      resize: vertical;
    }

    #txtResumen { height: 140px; }

    .pie {
      margin: 8px 0 0;
      font-size: 10px;
      color: #888;
      text-align: center;
    }
  </style>
</head>
<body>

  <h3>OnedriveTranscript</h3>

  <!-- API Key temporal (chrome.storage.session) -->
  <div class="api-container">
    <input type="password" id="txtApiKey"
           placeholder="Pega tu Gemini API Key aquí (solo esta sesión)..."
           autocomplete="off">
    <button id="btnGuardarKey" type="button">Guardar</button>
  </div>

  <!-- 1. Extracción de la transcripción -->
  <button id="btnExtraer" type="button">1. Obtener Transcripción</button>

  <!-- Contenedor de estados: carga, progreso Map-Reduce, errores y avisos -->
  <div id="estadoPopup"></div>

  <!-- Metadatos de la clase extraídos -->
  <div id="metaBox" class="meta-card">
    <p><strong>Clase:</strong> <span id="lblTitulo">-</span></p>
    <p><strong>Fecha:</strong> <span id="lblFecha">-</span>
       &nbsp;|&nbsp; <strong>Hora:</strong> <span id="lblHora">-</span></p>
  </div>

  <!-- 2. Resumen con IA -->
  <button id="btnResumir" type="button">2. Generar Resumen con Gemini IA</button>

  <div id="seccionResumen" style="display:none;">
    <div class="cabecera-bloque">
      <span class="label-box">Resumen de la Clase (IA)</span>
      <button id="btnCopiarResumen" class="btn-mini" type="button">Copiar</button>
    </div>
    <textarea id="txtResumen"
              placeholder="Aquí aparecerá el resumen generado por Gemini..."></textarea>
  </div>

  <!-- Transcripción limpia (editable antes de exportar) -->
  <div class="cabecera-bloque">
    <span class="label-box">Transcripción Completa</span>
    <button id="btnCopiarTranscripcion" class="btn-mini" type="button">Copiar</button>
  </div>
  <textarea id="resultado"
            placeholder="Aquí aparecerá el texto extraído..."></textarea>

  <!-- 3. Exportación: PDF aquí; los botones TXT y Markdown (btnTxt, btnMd)
         los añade popup.js junto a este en cuanto carga el popup -->
  <button id="btnPdf" type="button">PDF</button>

  <p class="pie">OnedriveTranscript · API Key y datos solo durante la sesión del navegador.</p>

  <script src="popup.js"></script>
</body>
</html>
